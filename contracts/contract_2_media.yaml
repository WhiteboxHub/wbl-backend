chunk_duration_seconds: 30
format: webm
video_codec: vp8
audio_codec: opus

gcs_paths:
  chunk: "ai-prep/{candidate_id}/{assessment_id}/chunks/{n}.webm"
  assembled: "ai-prep/{candidate_id}/{assessment_id}/full.webm"
  audio: "ai-prep/{candidate_id}/{assessment_id}/audio.wav"
  llm_raw: "ai-prep/{candidate_id}/{assessment_id}/llm_response.json"

signed_url_ttl_minutes: 15

upload_endpoint: "POST /api/ai-prep/media/upload-chunk"
assemble_endpoint: "POST /api/ai-prep/media/assemble"

chunk_payload:
  assessment_id: int
  chunk_number: int # 0-indexed
  total_chunks: int # -1 if unknown (streaming)
  file: binary (multipart)
