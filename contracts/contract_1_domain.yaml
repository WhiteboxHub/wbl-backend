assessment_types:
  - GENERAL_INTRO
  - JOB_DESCRIPTION_INTRO
  - RECRUITER
  - HIRING_MANAGER
  - TECHNICAL
  - SYSTEM_DESIGN
  - HR

no_pause_types:
  - GENERAL_INTRO
  - JOB_DESCRIPTION_INTRO

status_machine:
  TESTING: [IN_PROGRESS]
  IN_PROGRESS: [PROCESSING]
  PROCESSING: [COMPLETED, FAILED]

coaching_bands:
  EXCELLENT: { min: 85, max: 100 }
  STRONG: { min: 70, max: 84 }
  DEVELOPING: { min: 55, max: 69 }
  NEEDS_WORK: { min: 0, max: 54 }

scoring_formula: "(ai_engineering * 0.40) + (core_engineering * 0.30) + (non_technical * 0.20) + (business_acumen * 0.10)"

score_dimensions:
  ai_engineering: 0.40
  core_engineering: 0.30
  non_technical: 0.20
  business_acumen: 0.10
